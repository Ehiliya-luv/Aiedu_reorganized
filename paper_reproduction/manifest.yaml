schema_version: 1
data_version: public-aggregate-v1
source_policy: aggregate-values-only
data_dir: plot_data
figures:
  - id: question-preference
    source: question_preference.csv
    renderer: preference
    sha256: aca80290c16eb95feb24fe5735bc0c68ad7fdc893a3b85fe7525a66fc8b17128
    outputs: [question_preference.pdf, question_preference.png, question_preference.svg]
    required_columns: [model, preference_rate, ci_low, ci_high, valid_cases]
    numeric_checks: {min_rows: 8, max_rows: 8, rate_columns: [preference_rate, ci_low, ci_high]}
  - id: question-quality
    source: question_quality.csv
    renderer: question-quality
    sha256: fe8410bf1e9d177abe87c2a9065c1283a7a7b0820c3df138b6f0219aca8b7293
    outputs: [question_quality.pdf, question_quality.png, question_quality.svg]
    required_columns: [model, answer_key_accuracy, option_set_adequacy, stem_clarity]
    numeric_checks: {min_rows: 9, max_rows: 9, rate_columns: [answer_key_accuracy, option_set_adequacy, stem_clarity]}
  - id: reasoning-consistency
    source: reasoning_summary.csv
    renderer: reasoning
    sha256: 5eda8283de3b9b10bb69b380028cd8ec364f9b7cb9f3fbcac7f80bbe6e2a0d9d
    outputs: [reasoning_consistency.pdf, reasoning_consistency.png, reasoning_consistency.svg]
    required_columns: [group, case_consistency, supported, inferable, unsupported, contradicted]
    numeric_checks: {min_rows: 9, max_rows: 9, rate_columns: [case_consistency, hallucination_rate]}
  - id: workflow-time
    source: workflow_time_summary.csv
    renderer: workflow-time
    sha256: 747235f596ee7ccaa120e19fd77046473d749b5e380ccc240041784b5dca041d
    outputs: [workflow_time.pdf, workflow_time.png, workflow_time.svg]
    required_columns: [task, system_median_min, system_mean_min, clinician_median_min, clinician_mean_min]
    numeric_checks: {min_rows: 4, max_rows: 4, rate_columns: []}
